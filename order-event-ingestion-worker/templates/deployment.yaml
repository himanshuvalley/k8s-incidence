apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "order-event-ingestion-worker.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "order-event-ingestion-worker.name" . }}
    incident-type: sqs-ingestion-pipeline
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "order-event-ingestion-worker.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "order-event-ingestion-worker.name" . }}
        incident-type: sqs-ingestion-pipeline
        rca-test: alertmend
    spec:
      {{- if .Values.elasticsearch.deployInCluster }}
      initContainers:
        - name: wait-for-elasticsearch
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              ES_HOST="{{ include "order-event-ingestion-worker.elasticsearch.host" . }}"
              ES_PORT="{{ .Values.elasticsearch.port }}"
              echo "Waiting for Elasticsearch at ${ES_HOST}:${ES_PORT}..."
              until nc -z "${ES_HOST}" "${ES_PORT}" 2>/dev/null; do
                echo "ES port not open, retrying in 5s..."
                sleep 5
              done
              echo "ES port open, checking cluster health..."
              until wget -qO- "http://${ES_HOST}:${ES_PORT}/_cluster/health?wait_for_status=yellow&timeout=10s" >/dev/null 2>&1; do
                echo "ES not healthy yet, retrying in 5s..."
                sleep 5
              done
              echo "Elasticsearch is ready"
      {{- end }}
      {{- if .Values.imageCredentials.enabled }}
      imagePullSecrets:
        - name: {{ .Values.imageCredentials.secretName }}
      {{- end }}
      containers:
        - name: order-event-ingestion-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "order-event-ingestion-worker.fullname" . }}-config
            - secretRef:
                name: {{ include "order-event-ingestion-worker.fullname" . }}-secret
            - secretRef:
                name: aws-credentials
          resources:
{{ toYaml .Values.resources | indent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: 8080
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: 8080
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: 8080
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
