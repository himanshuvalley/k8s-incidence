{{- if .Values.elasticsearch.deployInCluster }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "order-event-ingestion-worker.elasticsearch.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "order-event-ingestion-worker.elasticsearch.fullname" . }}
    app.kubernetes.io/component: elasticsearch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "order-event-ingestion-worker.elasticsearch.fullname" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "order-event-ingestion-worker.elasticsearch.fullname" . }}
        app.kubernetes.io/component: elasticsearch
    spec:
      initContainers:
        - name: sysctl
          image: busybox:1.36
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
          securityContext:
            privileged: true
      containers:
        - name: elasticsearch
          image: "{{ .Values.elasticsearch.image.repository }}:{{ .Values.elasticsearch.image.tag }}"
          imagePullPolicy: {{ .Values.elasticsearch.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: xpack.security.http.ssl.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: {{ .Values.elasticsearch.javaOpts | quote }}
            - name: cluster.name
              value: order-event-ingestion-es
            - name: node.name
              value: es-node-1
            - name: bootstrap.memory_lock
              value: "false"
          resources:
{{ toYaml .Values.elasticsearch.resources | indent 12 }}
          volumeMounts:
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data
          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=5s
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: elasticsearch-data
          {{- if .Values.elasticsearch.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "order-event-ingestion-worker.elasticsearch.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
