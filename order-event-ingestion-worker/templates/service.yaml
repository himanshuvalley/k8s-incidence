apiVersion: v1
kind: Service
metadata:
  name: {{ include "order-event-ingestion-worker.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "order-event-ingestion-worker.name" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "order-event-ingestion-worker.name" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
