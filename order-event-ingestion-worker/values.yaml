replicaCount: 1

image:
  repository: incidence.azurecr.io/order-event-ingestion-worker
  tag: "1.0.0"
  pullPolicy: Always

imageCredentials:
  enabled: true
  registry: incidence.azurecr.io
  secretName: acr-registry-secret
  username: ""
  password: ""
  email: devops@example.com

service:
  type: ClusterIP
  port: 8080

app:
  serviceName: order-event-ingestion-worker
  releaseVersion: "1.0.0"
  workerEnabled: "true"
  workerPollInterval: "5"
  workerBatchSize: "5"
  startupFailure: "false"
  dependencyWaitSeconds: "300"
  dependencyWaitInterval: "5"

aws:
  region: ap-south-1
  sqsQueueUrl: ""

rds:
  host: ""
  port: "3306"
  database: "orders"
  username: "admin"
  password: ""

elasticsearch:
  deployInCluster: true
  host: ""
  port: "9200"
  index: "order-events"
  username: ""
  password: ""
  useSsl: "false"
  image:
    repository: docker.elastic.co/elasticsearch/elasticsearch
    tag: "8.15.1"
    pullPolicy: IfNotPresent
  javaOpts: "-Xms512m -Xmx512m"
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: "standard"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    path: /ready
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 6
  startup:
    enabled: true
    path: /ready
    periodSeconds: 10
    failureThreshold: 60
