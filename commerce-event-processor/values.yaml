replicaCount: 3

image:
  repository: incidence.azurecr.io/commerce-event-processor
  tag: "1.0.0"
  pullPolicy: Always

imageCredentials:
  enabled: true
  registry: incidence.azurecr.io
  secretName: acr-registry-secret
  username: ""
  password: ""
  email: devops@example.com

service:
  type: ClusterIP
  port: 8080

app:
  serviceName: commerce-event-processor
  releaseVersion: "1.0.0"
  workerEnabled: "true"
  workerBatchSize: "1"
  producerEnabled: "true"
  producerMessagesPerMinute: "60"
  normalProcessDelaySeconds: "1"
  dependencyWaitSeconds: "300"
  dependencyWaitInterval: "5"

aws:
  region: ap-south-1
  sqsQueueUrl: ""

rds:
  host: ""
  port: "3306"
  database: "commerce"
  username: "admin"
  password: ""

elasticsearch:
  index: "commerce-events"
  username: ""
  password: ""
  hosts:
    - "10.0.1.10:9200"
    - "10.0.1.11:9200"
    - "10.0.1.12:9200"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    path: /ready
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 6
  startup:
    enabled: true
    path: /ready
    periodSeconds: 10
    failureThreshold: 60
