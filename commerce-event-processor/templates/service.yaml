apiVersion: v1
kind: Service
metadata:
  name: {{ include "commerce-event-processor.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "commerce-event-processor.name" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "commerce-event-processor.name" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      name: http
