apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "retail-hub.fullname" . }}-web
  labels:
    {{- include "retail-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "retail-hub.name" . }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "retail-hub.name" . }}
        app.kubernetes.io/component: web
    spec:
      {{- include "retail-hub.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports: [{ name: http, containerPort: {{ .Values.web.port }} }]
          env:
            - name: PORT
              value: {{ .Values.web.port | quote }}
            - name: GATEWAY_URL
              value: "http://{{ include "retail-hub.fullname" . }}-gateway:{{ .Values.gateway.port }}"
          resources:
{{ toYaml .Values.web.resources | indent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: {{ .Values.web.port }} }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: {{ .Values.web.port }} }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "retail-hub.fullname" . }}-web
  labels:
    {{- include "retail-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: {{ include "retail-hub.name" . }}
    app.kubernetes.io/component: web
  ports:
    - port: {{ .Values.web.port }}
      targetPort: http
      name: http
