apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "retail-hub.fullname" . }}-gateway
  labels:
    {{- include "retail-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "retail-hub.name" . }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "retail-hub.name" . }}
        app.kubernetes.io/component: gateway
    spec:
      {{- include "retail-hub.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports: [{ name: http, containerPort: {{ .Values.gateway.port }} }]
          env:
            - name: PORT
              value: {{ .Values.gateway.port | quote }}
            - name: ORDERS_URL
              value: "http://{{ include "retail-hub.fullname" . }}-orders:{{ .Values.orders.port }}"
            - name: USERS_URL
              value: "http://{{ include "retail-hub.fullname" . }}-users:{{ .Values.users.port }}"
            - name: INVENTORY_URL
              value: "http://{{ include "retail-hub.fullname" . }}-inventory:{{ .Values.inventory.port }}"
            - name: ANALYTICS_URL
              value: "http://{{ include "retail-hub.fullname" . }}-analytics:{{ .Values.analytics.port }}"
            - name: PAYMENTS_URL
              value: "http://{{ include "retail-hub.fullname" . }}-payments:{{ .Values.payments.port }}"
          resources:
{{ toYaml .Values.gateway.resources | indent 12 }}
          startupProbe:
            httpGet: { path: /ready, port: {{ .Values.gateway.port }} }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /ready, port: {{ .Values.gateway.port }} }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: {{ .Values.gateway.port }} }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "retail-hub.fullname" . }}-gateway
  labels:
    {{- include "retail-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  selector:
    app.kubernetes.io/name: {{ include "retail-hub.name" . }}
    app.kubernetes.io/component: gateway
  ports:
    - port: {{ .Values.gateway.port }}
      targetPort: http
      name: http
