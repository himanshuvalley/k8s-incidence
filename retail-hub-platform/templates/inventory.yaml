apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "retail-hub.fullname" . }}-inventory
  labels:
    {{- include "retail-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: inventory
spec:
  replicas: {{ .Values.inventory.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "retail-hub.name" . }}
      app.kubernetes.io/component: inventory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "retail-hub.name" . }}
        app.kubernetes.io/component: inventory
    spec:
      {{- include "retail-hub.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: inventory
          image: "{{ .Values.inventory.image.repository }}:{{ .Values.inventory.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports: [{ name: http, containerPort: {{ .Values.inventory.port }} }]
          env:
            - name: PORT
              value: {{ .Values.inventory.port | quote }}
          envFrom:
            - secretRef:
                name: {{ include "retail-hub.fullname" . }}-redis
          resources:
{{ toYaml .Values.inventory.resources | indent 12 }}
          startupProbe:
            httpGet: { path: /ready, port: {{ .Values.inventory.port }} }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /ready, port: {{ .Values.inventory.port }} }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: {{ .Values.inventory.port }} }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "retail-hub.fullname" . }}-inventory
  labels:
    {{- include "retail-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: inventory
spec:
  selector:
    app.kubernetes.io/name: {{ include "retail-hub.name" . }}
    app.kubernetes.io/component: inventory
  ports:
    - port: {{ .Values.inventory.port }}
      targetPort: http
      name: http
