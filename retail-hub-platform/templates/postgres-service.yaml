apiVersion: v1
kind: Service
metadata:
  name: {{ include "retail-hub.fullname" . }}-postgres
  labels:
    {{- include "retail-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  selector:
    app.kubernetes.io/name: {{ include "retail-hub.name" . }}
    app.kubernetes.io/component: postgres
  ports:
    - port: {{ .Values.postgres.port }}
      targetPort: postgres
      name: postgres
