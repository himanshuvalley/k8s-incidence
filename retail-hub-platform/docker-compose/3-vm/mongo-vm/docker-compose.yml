# VM 2 — MongoDB
# Run on: MONGO VM
# Usage: docker compose up -d

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: retailhub
      MONGO_INITDB_ROOT_PASSWORD: changeme
    volumes:
      - retail-hub-mongo:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "-u",
          "retailhub",
          "-p",
          "changeme",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand({ ping: 1 })",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

volumes:
  retail-hub-mongo:
