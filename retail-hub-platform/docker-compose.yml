# Retail Hub Platform — Docker Compose (pre-built ACR images)
# Usage:
#   az acr login --name incidence
#   cd retail-hub-platform && docker compose pull && docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: retailhub
      POSTGRES_USER: retailhub
      POSTGRES_PASSWORD: changeme
    volumes:
      - retail-hub-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailhub -d retailhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: retailhub
      MONGO_INITDB_ROOT_PASSWORD: changeme
    volumes:
      - retail-hub-mongo:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "-u",
          "retailhub",
          "-p",
          "changeme",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand({ ping: 1 })",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  orders:
    image: incidence.azurecr.io/retail-hub-orders:1.0.0
    environment:
      PORT: "5001"
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: retailhub
      PG_USER: retailhub
      PG_PASSWORD: changeme
    depends_on:
      postgres:
        condition: service_healthy

  users:
    image: incidence.azurecr.io/retail-hub-users:1.0.0
    environment:
      PORT: "5002"
      MONGO_URI: mongodb://retailhub:changeme@mongodb:27017/retailhub?authSource=admin
      MONGO_DATABASE: retailhub
    depends_on:
      mongodb:
        condition: service_healthy

  inventory:
    image: incidence.azurecr.io/retail-hub-inventory:1.0.0
    environment:
      PORT: "5003"
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  analytics:
    image: incidence.azurecr.io/retail-hub-analytics:1.0.0
    environment:
      PORT: "5004"
      MONGO_URI: mongodb://retailhub:changeme@mongodb:27017/retailhub?authSource=admin
      MONGO_DATABASE: retailhub
    depends_on:
      mongodb:
        condition: service_healthy

  payments:
    image: incidence.azurecr.io/retail-hub-payments:1.0.0
    environment:
      PORT: "5005"
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: retailhub
      PG_USER: retailhub
      PG_PASSWORD: changeme
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    image: incidence.azurecr.io/retail-hub-gateway:1.0.0
    environment:
      PORT: "8080"
      ORDERS_URL: http://orders:5001
      USERS_URL: http://users:5002
      INVENTORY_URL: http://inventory:5003
      ANALYTICS_URL: http://analytics:5004
      PAYMENTS_URL: http://payments:5005
    depends_on:
      - orders
      - users
      - inventory
      - analytics
      - payments

  web:
    image: incidence.azurecr.io/retail-hub-web:1.0.0
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      GATEWAY_URL: http://gateway:8080
    depends_on:
      - gateway

volumes:
  retail-hub-pg:
  retail-hub-mongo:
