# Demo release name → pods: portal-web-*, portal-api-*, portal-db-*
nameOverride: portal
fullnameOverride: portal

web:
  replicaCount: 1
  image:
    repository: incidence.azurecr.io/portal-web
    tag: "1.0.1"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

api:
  replicaCount: 1
  image:
    repository: incidence.azurecr.io/portal-api
    tag: "1.0.1"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 4000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

db:
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  database: portal
  username: portal
  password: changeme
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

ingress:
  enabled: false
  className: nginx
  host: portal.local
  annotations: {}

imageCredentials:
  enabled: true
  registry: incidence.azurecr.io
  secretName: acr-registry-secret
  username: ""
  password: ""
  email: devops@example.com
